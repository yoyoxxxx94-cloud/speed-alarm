<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>منبه السرعة</title></head>
<body style="margin:0;background:#0b0f1a">
<script>
/* Loader: newest app from GitHub if online -> else last saved copy -> else the copy bundled in the APK */
(async()=>{
  const KEY='sahar-app-html';
  let html=null;
  try{
    const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);
    const r=await fetch('https://yoyoxxxx94-cloud.github.io/speed-alarm/app.html?'+Date.now(),{cache:'no-store',signal:c.signal});
    clearTimeout(t);
    if(r.ok){html=await r.text();if(html.indexOf('منبه السرعة')>-1){try{localStorage.setItem(KEY,html)}catch(e){}}else html=null}
  }catch(e){}
  if(!html){try{html=localStorage.getItem(KEY)}catch(e){}}
  if(!html){try{html=await (await fetch('app.html')).text()}catch(e){}}
  if(html){document.open();document.write(html);document.close()}
})();
</script></body></html>
