name: Build APK + Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Point the app at this repo's GitHub Pages
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          sed -i "s|GITHUB_USER|${OWNER}|; s|REPO_NAME|${REPO}|" capacitor.config.json
          cat capacitor.config.json

      - run: npm install
      - run: npx cap add android

      - name: Icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0f1a' --iconBackgroundColorDark '#0b0f1a' || true

      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK; do
            sed -i "s|</manifest>|    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>|" $M
          done

      - name: Same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Version number goes up every build
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" $G

      - run: npx cap sync android
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk sahar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: منبه السرعة 1.${{ github.run_number }}
          files: sahar.apk

  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - uses: actions/deploy-pages@v4
